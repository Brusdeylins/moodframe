// Note: printConveyorConfig task is automatically provided by the Conveyor plugin


// ================================================================================
// BUILD OPTIMIZATION CONFIGURATION
// ================================================================================

// OWASP Dependency Check Configuration
dependencyCheck {
    formats = ['HTML', 'JSON']
    outputDirectory = "$buildDir/reports/dependency-check"
    suppressionFile = 'dependency-check-suppressions.xml'
    
    // Skip test dependencies by default
    skipTestGroups = true
    
    // Configure NVD API (optional - requires free API key)
    nvd {
        apiKey = System.getenv('NVD_API_KEY') ?: ''
        delay = 2000 // Rate limiting
    }
    
    // Fail build on CVSS score >= 8.0 (High/Critical vulnerabilities)
    failBuildOnCVSS = 8.0
}

// Build Performance Optimizations
gradle.projectsEvaluated {
    tasks.withType(JavaCompile) {
        options.compilerArgs += [
            '-Xlint:unchecked',
            '-Xlint:deprecation',
            '-parameters' // Enable parameter names for better debugging
        ]
        // Enable incremental compilation
        options.incremental = true
    }
}

// JavaFX module path handled by javafx plugin

// Enable Gradle Build Cache
tasks.withType(Test) {
    outputs.upToDateWhen { false } // Always run tests for safety
}

// Note: Build performance optimizations are configured in gradle.properties

// Create suppression file for dependency check if it doesn't exist
task createDependencyCheckSuppressions {
    def suppressionFile = file('dependency-check-suppressions.xml')
    if (!suppressionFile.exists()) {
        suppressionFile.text = """<?xml version="1.0" encoding="UTF-8"?>
<suppressions xmlns="https://jeremylong.github.io/DependencyCheck/dependency-suppression.1.3.xsd">
    <!-- Add suppression rules here for false positives -->
    <!--
    <suppress>
        <notes>False positive: This vulnerability does not apply to our usage</notes>
        <packageUrl regex="true">^pkg:maven/org\\.example/.*\$</packageUrl>
        <cve>CVE-YYYY-XXXXX</cve>
    </suppress>
    -->
</suppressions>"""
    }
}

// Dependency check task will automatically use the suppression file when it runs

// Bundle size analysis task
task analyzeBundleSize {
    group = 'build'
    description = 'Analyze bundle size and dependencies'
    dependsOn 'jar'
    
    doLast {
        def jarFile = jar.archiveFile.get().asFile
        def jarSize = jarFile.length()
        
        println "📦 JAR Analysis:"
        println "   File: ${jarFile.name}"
        println "   Size: ${String.format("%.2f", jarSize / 1024.0 / 1024.0)} MB"
        
        // Analyze dependencies
        def totalDepsSize = 0
        configurations.runtimeClasspath.files.each { file ->
            if (file.name.endsWith('.jar')) {
                totalDepsSize += file.length()
            }
        }
        
        println "📚 Dependencies:"
        println "   Total Size: ${String.format("%.2f", totalDepsSize / 1024.0 / 1024.0)} MB"
        println "   Count: ${configurations.runtimeClasspath.files.size()} files"
        
        def totalSize = jarSize + totalDepsSize
        println "🎯 Total Bundle Size: ${String.format("%.2f", totalSize / 1024.0 / 1024.0)} MB"
        
        // Size targets
        if (totalSize > 100 * 1024 * 1024) {
            println "⚠️  WARNING: Bundle size exceeds 100MB target (${String.format("%.2f", totalSize / 1024.0 / 1024.0)} MB)"
        } else {
            println "✅ Bundle size within 100MB target"
        }
    }
}

// Create processResources task to generate build info
tasks.named('processResources') {
    doLast {
        // Create build.properties with version and build information
        def buildPropsFile = file("$buildDir/resources/main/build.properties")
        buildPropsFile.parentFile.mkdirs()
        
        def props = new Properties()
        props.setProperty('build.version', project.version.toString())
        props.setProperty('build.timestamp', new Date().toString())
        props.setProperty('build.gradle.version', gradle.gradleVersion)
        
        // Add Git information if available
        try {
            def gitCommit = 'git rev-parse HEAD'.execute().text.trim()
            props.setProperty('build.git.commit', gitCommit)
        } catch (Exception e) {
            // Git not available or not a git repository
            props.setProperty('build.git.commit', 'unknown')
        }
        
        props.store(buildPropsFile.newWriter(), 'Build Information')
    }
}

// Ensure JAR manifest contains version information
jar {
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Matthias Brusdeylins',
            'Specification-Title': project.description,
            'Specification-Version': project.version,
            'Main-Class': 'art.moodframe.MoodframeApplication',
            'Built-By': System.getProperty('user.name'),
            'Built-Date': new Date().toString(),
            'Built-JDK': System.getProperty('java.version'),
            'Built-Gradle': gradle.gradleVersion
        )
    }
}

// Enhanced build task with timing
task enhancedBuild {
    group = 'build'
    description = 'Build with performance monitoring and security checks'
    
    def startTime = System.currentTimeMillis()
    
    dependsOn 'clean', 'compileJava', 'test', 'jar', 'analyzeBundleSize'
    // Note: dependencyCheckAnalyze excluded from regular builds due to long execution time
    // Run manually: ./gradlew dependencyCheckAnalyze
    
    doLast {
        def duration = (System.currentTimeMillis() - startTime) / 1000.0
        println "⏱️  Build completed in ${String.format("%.2f", duration)} seconds"
        
        // Check against the target (< 30 seconds)
        if (duration > 30) {
            println "⚠️  WARNING: Build time exceeds 30s target (${String.format("%.2f", duration)}s)"
        } else {
            println "✅ Build time within 30s target"
        }
    }
}
// Conveyor configuration for Moodframe
// See https://conveyor.hydraulic.dev for documentation

include "#!./gradlew -q printConveyorConfig"

// Application metadata
app {
    display-name = "Moodframe"
    fsname = "moodframe"
    rdns-name = "tools.moodframe"
    vendor = "Matthias Brusdeylins"
    license = "MIT"

    site {
        # Where the apps will look for updates.
        base-url = "https://moodframe.tools/download"

        # Allow overwriting during development
        consistency-checks = warn
    }

    # Force an update check on each launch
    updates = aggressive

    # Open source projects use Conveyor for free
    vcs-url = "https://github.com/Brusdeylins/moodframe"

    icons = "icons/icon-1024.png"
}

// JVM configuration
app.jvm {
    # Module with all Locale resources
    modules += "jdk.localedata"

    # flag to jlink, so that reflection is supported and all languages are included
    jlink-flags = [
        "--add-modules", "jdk.localedata",
        "--include-locales", "*"
    ]
}

// macOS-specific configuration
app.mac {
    # Require at least macOS 11.0 for JavaFX 21
    info-plist.LSMinimumSystemVersion = 11.0

    # Allow native-level debugging with lldb
    entitlements-plist {
        "com.apple.security.get-task-allow" = true
    }

    sign = true
}

// Windows-specific configuration: MSI only (MSIX caused memory problems)
app.windows {
    installer-types = [msi]
}

conveyor.compatibility-level = 14

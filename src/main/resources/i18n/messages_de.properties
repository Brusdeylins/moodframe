# ==============================================
# GEMINI API FEHLERMELDUNGEN
# ==============================================
gemini.error.safety=Bild wurde aus Sicherheitsgründen blockiert.\n\nLösungshinweise:\n• Vermeiden Sie sensible oder anstößige Begriffe\n• Formulieren Sie den Prompt neutraler\n• Vermeiden Sie Darstellungen von Gewalt oder expliziten Inhalten
gemini.error.prohibited=Inhalt verstößt gegen Google's Nutzungsrichtlinien.\n\nLösungshinweise:\n• Entfernen Sie problematische Begriffe aus dem Prompt\n• Vermeiden Sie urheberrechtlich geschützte Markennamen\n• Keine Darstellung realer Personen
gemini.error.image.other=Gemini konnte das Bild nicht generieren.\n\nLösungshinweise:\n• Vereinfachen Sie komplexe Beschreibungen\n• Vermeiden Sie das Wort 'Logo' (kann Markenrechte triggern)\n• Vermeiden Sie widersprüchliche Anweisungen im Prompt\n• Versuchen Sie es erneut (intermittierender API-Fehler)
gemini.error.no.image=Gemini konnte kein Bild generieren.\n\nLösungshinweise:\n• Beschreiben Sie das gewünschte Bild klarer\n• Fügen Sie mehr visuelle Details hinzu\n• Vermeiden Sie abstrakte oder widersprüchliche Anweisungen
gemini.error.no.image.video=Gemini hat für diese Anfrage kein Bild zurückgegeben. Das kommt bei Video-Eingaben gelegentlich vor und ist nicht reproduzierbar.\n\nLösungshinweise:\n• Erneut versuchen – oft klappt der nächste Versuch\n• Zeitbereich auf eine markante, gut sichtbare Szene eingrenzen\n• Anweisung konkreter und visueller formulieren
gemini.error.recitation=Inhalt könnte urheberrechtlich geschützt sein.\n\nLösungshinweise:\n• Vermeiden Sie direkte Referenzen zu bekannten Werken\n• Formulieren Sie den Prompt einzigartiger\n• Erhöhen Sie die kreative Freiheit in der Beschreibung
gemini.error.other=Die Anfrage konnte nicht verarbeitet werden.\n\nLösungshinweise:\n• Überprüfen Sie den Prompt auf problematische Inhalte\n• Versuchen Sie es mit einem kürzeren Prompt\n• Versuchen Sie es später erneut
gemini.error.other.with.image=Die Anfrage konnte nicht verarbeitet werden.\n\nLösungshinweise:\n• ⚠️ Das angehängte Bild könnte problematische Inhalte enthalten\n• Versuchen Sie ein anderes Bild oder entfernen Sie das Bild\n• Überprüfen Sie auch den Prompt auf problematische Inhalte\n• Versuchen Sie es später erneut
gemini.error.safety.with.image=Bild wurde aus Sicherheitsgründen blockiert.\n\nLösungshinweise:\n• ⚠️ Das angehängte Bild enthält möglicherweise sensible oder anstößige Inhalte\n• Versuchen Sie ein anderes Bild oder entfernen Sie das Bild\n• Vermeiden Sie sensible oder anstößige Begriffe im Prompt\n• Formulieren Sie den Prompt neutraler
gemini.error.prohibited.with.image=Inhalt verstößt gegen Google's Nutzungsrichtlinien.\n\nLösungshinweise:\n• ⚠️ Das angehängte Bild verstößt möglicherweise gegen Nutzungsrichtlinien\n• Versuchen Sie ein anderes Bild oder entfernen Sie das Bild\n• Entfernen Sie problematische Begriffe aus dem Prompt\n• Keine Darstellung realer Personen
gemini.error.blocklist=Der Prompt enthält blockierte Begriffe.\n\nLösungshinweise:\n• Entfernen Sie anstößige oder sensible Wörter\n• Verwenden Sie alternative Formulierungen
gemini.error.blocklist.with.image=Der Prompt oder das Bild enthält blockierte Inhalte.\n\nLösungshinweise:\n• ⚠️ Das angehängte Bild könnte blockierte Inhalte enthalten\n• Versuchen Sie ein anderes Bild oder entfernen Sie das Bild\n• Entfernen Sie anstößige oder sensible Wörter aus dem Prompt
gemini.error.spii=Sensible persönliche Daten erkannt.\n\nLösungshinweise:\n• Entfernen Sie Namen, Adressen oder andere persönliche Informationen\n• Anonymisieren Sie die Beschreibung
gemini.error.spii.with.image=Sensible persönliche Daten erkannt.\n\nLösungshinweise:\n• ⚠️ Das angehängte Bild könnte persönliche Informationen enthalten\n• Versuchen Sie ein anderes Bild oder entfernen Sie das Bild\n• Entfernen Sie Namen, Adressen aus dem Prompt\n• Anonymisieren Sie die Beschreibung
gemini.error.max.tokens=Das Token-Limit wurde erreicht.\n\nLösungshinweise:\n• Kürzen Sie den Prompt erheblich\n• Reduzieren Sie die Anzahl der Details\n• Teilen Sie komplexe Anfragen in mehrere Prompts auf
gemini.error.language=Sprachbezogenes Problem erkannt.\n\nLösungshinweise:\n• Verwenden Sie Englisch für beste Ergebnisse\n• Vermeiden Sie Mischung verschiedener Sprachen\n• Prüfen Sie auf Tippfehler oder ungewöhnliche Zeichen
gemini.error.malformed.function=Interner Funktionsaufruf fehlgeschlagen.\n\nLösungshinweise:\n• Dies ist ein technischer Fehler\n• Versuchen Sie es erneut\n• Wenden Sie sich an den Support, wenn das Problem weiterhin besteht
gemini.error.default=Generierung fehlgeschlagen: {0}\n\nVersuchen Sie es mit einem anderen Prompt.

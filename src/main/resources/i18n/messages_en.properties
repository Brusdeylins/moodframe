# ==============================================
# GEMINI API ERROR MESSAGES
# ==============================================
gemini.error.safety=Image was blocked for safety reasons.\n\nSuggestions:\n• Avoid sensitive or offensive terms\n• Rephrase the prompt more neutrally\n• Avoid depictions of violence or explicit content
gemini.error.prohibited=Content violates Google's usage policies.\n\nSuggestions:\n• Remove problematic terms from the prompt\n• Avoid copyrighted brand names\n• No depiction of real persons
gemini.error.image.other=Gemini could not generate the image.\n\nSuggestions:\n• Simplify complex descriptions\n• Avoid the word 'Logo' (may trigger trademark issues)\n• Avoid contradictory instructions in the prompt\n• Try again (intermittent API error)
gemini.error.no.image=Gemini could not generate an image.\n\nSuggestions:\n• Describe the desired image more clearly\n• Add more visual details\n• Avoid abstract or contradictory instructions
gemini.error.no.image.video=Gemini did not return an image for this request. This happens occasionally with video input and is not reproducible.\n\nSuggestions:\n• Try again – the next attempt often works\n• Narrow the time range to one distinctive, clearly visible scene\n• Make the instruction more concrete and visual
gemini.error.recitation=Content may be copyrighted.\n\nSuggestions:\n• Avoid direct references to known works\n• Make the prompt more unique\n• Increase creative freedom in the description
gemini.error.other=The request could not be processed.\n\nSuggestions:\n• Check the prompt for problematic content\n• Try a shorter prompt\n• Try again later
gemini.error.other.with.image=The request could not be processed.\n\nSuggestions:\n• ⚠️ The attached image may contain problematic content\n• Try a different image or remove the image\n• Also check the prompt for problematic content\n• Try again later
gemini.error.safety.with.image=Image was blocked for safety reasons.\n\nSuggestions:\n• ⚠️ The attached image may contain sensitive or offensive content\n• Try a different image or remove the image\n• Avoid sensitive or offensive terms in the prompt\n• Rephrase the prompt more neutrally
gemini.error.prohibited.with.image=Content violates Google's usage policies.\n\nSuggestions:\n• ⚠️ The attached image may violate usage policies\n• Try a different image or remove the image\n• Remove problematic terms from the prompt\n• No depiction of real persons
gemini.error.blocklist=The prompt contains blocked terms.\n\nSuggestions:\n• Remove offensive or sensitive words\n• Use alternative phrasings
gemini.error.blocklist.with.image=The prompt or image contains blocked content.\n\nSuggestions:\n• ⚠️ The attached image may contain blocked content\n• Try a different image or remove the image\n• Remove offensive or sensitive words from the prompt
gemini.error.spii=Sensitive personal data detected.\n\nSuggestions:\n• Remove names, addresses, or other personal information\n• Anonymize the description
gemini.error.spii.with.image=Sensitive personal data detected.\n\nSuggestions:\n• ⚠️ The attached image may contain personal information\n• Try a different image or remove the image\n• Remove names, addresses from the prompt\n• Anonymize the description
gemini.error.max.tokens=Token limit reached.\n\nSuggestions:\n• Significantly shorten the prompt\n• Reduce the number of details\n• Split complex requests into multiple prompts
gemini.error.language=Language-related issue detected.\n\nSuggestions:\n• Use English for best results\n• Avoid mixing different languages\n• Check for typos or unusual characters
gemini.error.malformed.function=Internal function call failed.\n\nSuggestions:\n• This is a technical error\n• Try again\n• Contact support if the problem persists
gemini.error.default=Generation failed: {0}\n\nTry a different prompt.

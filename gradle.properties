# Build Performance Optimization
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# Java Toolchain Configuration (uses toolchain from build.gradle)
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# Enable Gradle build cache for faster builds
org.gradle.caching=true

# Enable parallel builds (use multiple CPU cores)
org.gradle.parallel=true

# Configure Gradle daemon for faster startup
org.gradle.daemon=true

# Enable configuration on demand (faster configuration phase)
org.gradle.configureondemand=true

# Enable incremental compilation
org.gradle.incremental=true

# Optimize file watching
org.gradle.vfs.watch=true

# JavaFX properties
javafx.runtime.path=
javafx.runtime.version=21.0.2

# Application properties
app.name=MoodFrame
app.vendor=Matthias Brusdeylins
app.description=Desktop studio for AI image generation (FLUX, Gemini, OpenAI)
app.copyright=Copyright © 2025-2026 Matthias Brusdeylins

# Security and Quality Assurance
dependency.check.enabled=true

# Build targets
build.time.target=30
bundle.size.target.mb=100
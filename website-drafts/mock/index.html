<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website Mockups</title>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; background: #0b1316; color: #c9d6d8; font: 15px/1.5 -apple-system, "Helvetica Neue", sans-serif; }
        nav { position: sticky; top: 0; display: flex; gap: 8px; padding: 12px 16px; background: #0b1316ee; border-bottom: 1px solid #ffffff1f; }
        button { background: #ffffff10; color: inherit; border: 1px solid #ffffff30; border-radius: 16px; padding: 6px 14px; cursor: pointer; }
        button[aria-pressed="true"] { background: #2fb8a633; border-color: #2fb8a6; color: #fff; }
        object { display: block; width: 100%; max-width: 1440px; margin: 0 auto; }
    </style>
</head>
<body>
    <nav>
        <button data-src="a-glass-stage.svg" aria-pressed="true">A · Glass Stage</button>
        <button data-src="b-splash-column.svg">B · Splash Column</button>
        <button data-src="c-studio-anatomy.svg">C · Studio Anatomy</button>
        <button data-src="d-glass-stage.svg">D · Glass Stage + Install</button>
    </nav>
    <object id="mock" type="image/svg+xml" data="a-glass-stage.svg"></object>
    <script>
        for (const button of document.querySelectorAll("button")) {
            button.addEventListener("click", () => {
                document.querySelectorAll("button").forEach((other) => other.setAttribute("aria-pressed", other === button))
                document.getElementById("mock").data = button.dataset.src
                window.scrollTo(0, 0)
            })
        }
    </script>
</body>
</html>

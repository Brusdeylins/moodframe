<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3080" viewBox="0 0 1440 3080">
    <!--  Proposal A "Glass Stage": the splash scene as a wide hero, the app stands on the same reflective floor  -->
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Inter:wght@300;400;600&amp;display=swap");
        svg { fill: #c9d6d8; }
        text { font-family: Inter, -apple-system, "Helvetica Neue", sans-serif; }
        .display { font-family: "Space Grotesk", "Avenir Next", "Helvetica Neue", sans-serif; font-weight: 700; fill: #ffffff; }
        .h2 { font-family: "Space Grotesk", "Avenir Next", "Helvetica Neue", sans-serif; font-weight: 500; font-size: 44px; fill: #ffffff; }
        .eyebrow { font-size: 13px; letter-spacing: 4px; fill: #7fb5b0; }
        .body { font-size: 18px; font-weight: 300; fill: #b7c7c9; }
        .small { font-size: 14px; fill: #8fa3a6; }
        .chip { font-size: 13px; fill: #e6f0f0; }
        .note { font-size: 13px; fill: #f5b83d; font-style: italic; }
    </style>
    <defs>
        <linearGradient id="mood" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ff6b4a"/><stop offset=".35" stop-color="#f5b83d"/>
            <stop offset=".7" stop-color="#2fb8a6"/><stop offset="1" stop-color="#5b6ee1"/>
        </linearGradient>
        <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0d1a1e"/><stop offset=".5" stop-color="#11252b"/><stop offset="1" stop-color="#0a1215"/>
        </linearGradient>
        <linearGradient id="heroFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset=".75" stop-color="#0d1a1e" stop-opacity="0"/><stop offset="1" stop-color="#0f1f24"/>
        </linearGradient>
        <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#10232a" stop-opacity=".4"/><stop offset="1" stop-color="#10232a"/>
        </linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".09"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
        </linearGradient>
        <clipPath id="floor"><rect x="0" y="1573" width="1440" height="170"/></clipPath>
        <clipPath id="t1"><rect width="176" height="118" rx="8"/></clipPath>
        <clipPath id="frameImg"><rect width="560" height="373" rx="8"/></clipPath>
    </defs>
    <rect width="1440" height="3080" fill="url(#page)"/>

    <!--  hero: the splash scene widened, text on the calm left half  -->
    <image href="images/hero-wide.jpg" x="-200" y="0" width="1700" height="722" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1440" height="723" fill="url(#heroFade)"/>
    <image href="images/wordmark.svg" x="56" y="26" width="140" height="49"/>
    <g class="small" font-size="15">
        <text x="900" y="56" style="fill:#dfe9ea">Mood</text><text x="972" y="56" style="fill:#dfe9ea">Frame</text>
        <text x="1050" y="56" style="fill:#dfe9ea">Models</text><text x="1134" y="56" style="fill:#dfe9ea">Download</text>
    </g>
    <rect x="1236" y="34" width="150" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".25"/>
    <text x="1256" y="56" class="chip">GitHub</text><text x="1316" y="56" class="chip" style="fill:#2fb8a6">v2.0.0</text>

    <text x="96" y="250" class="eyebrow">DESKTOP STUDIO FOR AI IMAGES</text>
    <text x="92" y="350" class="display" font-size="96">Mood in.</text>
    <text x="92" y="450" class="display" font-size="96">Frame out.</text>
    <rect x="96" y="478" width="300" height="5" rx="2.5" fill="url(#mood)"/>
    <text x="96" y="530" class="body">The mood decides how an image feels, the frame how</text>
    <text x="96" y="556" class="body">it is rendered. One app for FLUX, Nano Banana and</text>
    <text x="96" y="582" class="body">every OpenAI-compatible image API.</text>
    <rect x="96" y="622" width="236" height="54" rx="27" fill="#ffffff"/>
    <text x="214" y="655" text-anchor="middle" font-size="16" font-weight="600" style="fill:#0d1a1e">Download for macOS</text>
    <rect x="348" y="622" width="210" height="54" rx="27" fill="none" stroke="#ffffff" stroke-opacity=".4"/>
    <text x="453" y="655" text-anchor="middle" font-size="16" style="fill:#ffffff">Windows · Linux</text>
    <text x="96" y="712" class="small">Version 2.0.0 · released 12 Nov 2026 · free and open source (MIT)</text>

    <!--  the app on the floor, with its reflection  -->
    <text x="720" y="900" class="eyebrow" text-anchor="middle">ONE STUDIO, EVERY IMAGE MODEL</text>
    <image href="images/app-screenshot.png" x="220" y="940" width="1000" height="633"/>
    <g clip-path="url(#floor)"><g transform="translate(0 3146) scale(1 -1)" opacity=".3">
        <image href="images/app-screenshot.png" x="220" y="940" width="1000" height="633"/>
    </g></g>
    <rect x="0" y="1573" width="1440" height="171" fill="url(#reflect)"/>
    <rect x="0" y="1573" width="1440" height="1" fill="#ffffff" fill-opacity=".08"/>
    <text x="720" y="1640" class="note" text-anchor="middle">Screenshot: real app with a demo library (throwaway home, made-up chat names), not this drawing</text>

    <!--  Mood and Frame as two glass cards  -->
    <text x="96" y="1760" class="eyebrow">HOW IT WORKS</text>
    <text x="96" y="1820" class="h2">Two decisions per image</text>

    <rect x="96" y="1864" width="600" height="640" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="128" y="1902" width="5" height="26" rx="2.5" fill="#bf8aff"/>
    <text x="146" y="1924" class="display" font-size="28">Mood</text>
    <text x="128" y="1964" class="body" font-size="16">How the image feels: combined from building blocks,</text>
    <text x="128" y="1988" class="body" font-size="16">each one lockable, saved as a named mood.</text>
    <g transform="translate(128 2016)">
        <g clip-path="url(#t1)"><image href="images/mood-golden.jpg" width="176" height="118" preserveAspectRatio="xMidYMid slice"/></g>
        <g transform="translate(192 0)" clip-path="url(#t1)"><image href="images/mood-fog.jpg" width="176" height="118" preserveAspectRatio="xMidYMid slice"/></g>
        <g transform="translate(384 0)" clip-path="url(#t1)"><image href="images/mood-neon.jpg" width="176" height="118" preserveAspectRatio="xMidYMid slice"/></g>
        <text x="0" y="140" class="small">Golden coast</text><text x="192" y="140" class="small">Nordic fog</text><text x="384" y="140" class="small">Storm noir</text>
    </g>
    <text x="128" y="2200" class="small">Same prompt, three moods</text>
    <g class="chip">
        <rect x="128" y="2226" width="76" height="32" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2"/><text x="146" y="2247">Style</text>
        <rect x="212" y="2226" width="116" height="32" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2"/><text x="230" y="2247">Atmosphere</text>
        <rect x="336" y="2226" width="76" height="32" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2"/><text x="354" y="2247">Light</text>
        <rect x="420" y="2226" width="122" height="32" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2"/><text x="438" y="2247">Color palette</text>
        <rect x="550" y="2226" width="96" height="32" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".2"/><text x="568" y="2247">Camera</text>
    </g>
    <text x="128" y="2300" class="body" font-size="16">✦ Built-in blocks and your own, with an example image</text>
    <text x="128" y="2326" class="body" font-size="16">   for every camera setting</text>
    <text x="128" y="2360" class="body" font-size="16">✦ Mood from image: derive a mood from any picture</text>
    <text x="128" y="2394" class="body" font-size="16">✦ Every image remembers its mood</text>
    <text x="128" y="2428" class="body" font-size="16">✦ Browse all images of a mood across chats</text>

    <rect x="744" y="1864" width="600" height="640" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="776" y="1902" width="5" height="26" rx="2.5" fill="#2fb8a6"/>
    <text x="794" y="1924" class="display" font-size="28">Frame</text>
    <text x="776" y="1964" class="body" font-size="16">How the image is rendered: target aspect ratio and</text>
    <text x="776" y="1988" class="body" font-size="16">resolution, saved as a named frame.</text>
    <g transform="translate(776 2016)">
        <g clip-path="url(#frameImg)"><image href="images/mood-golden.jpg" width="560" height="373" preserveAspectRatio="xMidYMid slice" opacity=".55"/></g>
        <g fill="none" stroke-width="2">
            <rect x="0" y="0" width="560" height="373" rx="8" stroke="#ffffff" stroke-opacity=".9"/>
            <rect x="0" y="29" width="560" height="315" stroke="#2fb8a6" stroke-dasharray="8 6"/>
            <rect x="93" y="0" width="373" height="373" stroke="#f5b83d" stroke-dasharray="8 6"/>
            <rect x="175" y="0" width="210" height="373" stroke="#ff6b4a" stroke-dasharray="8 6"/>
        </g>
        <g class="chip" font-weight="600">
            <text x="12" y="24">3:2</text><text x="12" y="338" style="fill:#2fb8a6">16:9</text>
            <text x="103" y="360" style="fill:#f5b83d">1:1</text><text x="185" y="24" style="fill:#ff6b4a">9:16</text>
        </g>
    </g>
    <text x="776" y="2420" class="body" font-size="16">✦ Every model takes its closest ratio and resolution,</text>
    <text x="776" y="2446" class="body" font-size="16">   the app shows you which</text>
    <text x="776" y="2480" class="body" font-size="16">✦ Group your library by frame</text>

    <!--  supported image APIs  -->
    <text x="720" y="2620" class="eyebrow" text-anchor="middle">BRING YOUR OWN API KEY</text>
    <g>
        <rect x="216" y="2652" width="320" height="120" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".12"/>
        <rect x="560" y="2652" width="320" height="120" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".12"/>
        <rect x="904" y="2652" width="320" height="120" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".12"/>
        <text x="376" y="2706" text-anchor="middle" class="display" font-size="24" style="fill:#e6f0f0">[BFL logo]</text>
        <text x="720" y="2706" text-anchor="middle" class="display" font-size="24" style="fill:#e6f0f0">[Gemini logo]</text>
        <text x="1064" y="2706" text-anchor="middle" class="display" font-size="24" style="fill:#e6f0f0">[OpenAI logo]</text>
        <text x="376" y="2742" text-anchor="middle" class="small">FLUX 3 · FLUX.2</text>
        <text x="720" y="2742" text-anchor="middle" class="small">Nano Banana · Omni video</text>
        <text x="1064" y="2742" text-anchor="middle" class="small">OpenAI or your own gateway</text>
    </g>

    <!--  footer  -->
    <rect x="0" y="2860" width="1440" height="1" fill="#ffffff" fill-opacity=".1"/>
    <image href="images/wordmark.svg" x="96" y="2900" width="120" height="42"/>
    <text x="250" y="2928" class="small">Built with Agentic Coding using Claude Code and ASE · © Matthias Brusdeylins 2025-2026 · MIT</text>
    <text x="1344" y="2928" class="small" text-anchor="end">GitHub · Changelog · Releases</text>
    <text x="720" y="3030" class="note" text-anchor="middle">Logos: official marks from the providers' press kits, monochrome white</text>
</svg>

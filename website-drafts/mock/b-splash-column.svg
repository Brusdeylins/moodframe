<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3640" viewBox="0 0 1440 3640">
    <!--  Proposal B "Splash Column": the splash image itself in the middle of the hero, an editorial page below  -->
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Inter:wght@200;300;400;600&amp;display=swap");
        svg { fill: #c9d6d8; }
        text { font-family: Inter, -apple-system, "Helvetica Neue", sans-serif; }
        .display { font-family: "Space Grotesk", "Avenir Next", "Helvetica Neue", sans-serif; font-weight: 500; }
        .eyebrow { font-size: 13px; letter-spacing: 4px; }
        .body { font-size: 18px; font-weight: 300; }
        .small { font-size: 14px; }
        .note { font-size: 13px; font-style: italic; }
    </style>
    <defs>
        <radialGradient id="stage" cx=".5" cy=".18" r=".9">
            <stop offset="0" stop-color="#22454d"/><stop offset=".45" stop-color="#132a30"/><stop offset="1" stop-color="#090f11"/>
        </radialGradient>
        <linearGradient id="mood" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ff6b4a"/><stop offset=".35" stop-color="#f5b83d"/>
            <stop offset=".7" stop-color="#2fb8a6"/><stop offset="1" stop-color="#5b6ee1"/>
        </linearGradient>
        <linearGradient id="glassEdge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".12"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity=".4"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#000" flood-opacity=".55"/></filter>
        <clipPath id="splash"><rect x="480" y="120" width="480" height="720" rx="6"/></clipPath>
        <clipPath id="big"><rect width="760" height="507" rx="4"/></clipPath>
        <clipPath id="sm"><rect width="300" height="200" rx="4"/></clipPath>
        <clipPath id="frameImg"><rect width="640" height="427"/></clipPath>
    </defs>
    <rect width="1440" height="3640" fill="url(#stage)"/>

    <!--  nav  -->
    <g class="small" style="fill:#dfe9ea">
        <text x="96" y="58">Mood</text><text x="164" y="58">Frame</text><text x="238" y="58">Models</text>
    </g>
    <image href="images/wordmark.svg" x="660" y="26" width="120" height="42"/>
    <text x="1344" y="58" class="small" text-anchor="end" style="fill:#dfe9ea">GitHub ↗</text>

    <!--  hero: claim left, the splash in the middle, download right  -->
    <text x="96" y="300" class="eyebrow" style="fill:#7fb5b0">DESKTOP STUDIO FOR AI IMAGES</text>
    <text x="94" y="368" class="display" font-size="54" style="fill:#ffffff">The mood</text>
    <text x="94" y="430" class="display" font-size="54" style="fill:#ffffff">decides how</text>
    <text x="94" y="492" class="display" font-size="54" style="fill:#ffffff">it feels.</text>
    <text x="96" y="548" class="body">The frame decides how it is</text>
    <text x="96" y="574" class="body">rendered. FLUX, Nano Banana and</text>
    <text x="96" y="600" class="body">OpenAI-compatible APIs in one app.</text>

    <g filter="url(#shadow)">
        <image href="images/splash.png" x="480" y="120" width="480" height="720" clip-path="url(#splash)" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <g transform="translate(720 886)" text-anchor="middle" style="fill:#ffffff">
        <text font-size="14"><tspan font-weight="600">Mood</tspan><tspan font-weight="300">Frame · Version 2.0.0 · © Matthias Brusdeylins 2025-2026</tspan></text>
        <text y="24" font-size="12" font-weight="200">Built with Agentic Coding using Claude Code and ASE</text>
    </g>

    <g transform="translate(1040 260)">
        <text class="eyebrow" style="fill:#7fb5b0">DOWNLOAD 2.0.0</text>
        <rect y="24" width="304" height="56" rx="10" fill="#ffffff"/>
        <text x="20" y="58" font-size="16" font-weight="600" style="fill:#0b1316">macOS</text>
        <text x="284" y="58" font-size="13" text-anchor="end" style="fill:#4a5b5e">Apple Silicon · Intel</text>
        <rect y="92" width="304" height="56" rx="10" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".25"/>
        <text x="20" y="126" font-size="16" style="fill:#ffffff">Windows</text>
        <text x="284" y="126" font-size="13" text-anchor="end">exe · msix · zip</text>
        <rect y="160" width="304" height="56" rx="10" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".25"/>
        <text x="20" y="194" font-size="16" style="fill:#ffffff">Linux</text>
        <text x="284" y="194" font-size="13" text-anchor="end">deb · tar.gz</text>
        <text y="252" class="small">Latest release on GitHub: <tspan style="fill:#2fb8a6">v2.0.0 ↗</tspan></text>
        <text y="276" class="small">Updates are checked on every launch.</text>
        <text y="300" class="small">Free and open source (MIT).</text>
    </g>

    <!--  Mood: one big image, the two other moods, the recipe of the big one  -->
    <rect x="96" y="1000" width="1248" height="1" fill="#ffffff" fill-opacity=".12"/>
    <text x="96" y="1060" class="eyebrow" style="fill:#bf8aff">01 · MOOD</text>
    <text x="94" y="1124" class="display" font-size="46" style="fill:#ffffff">Same prompt. Three moods.</text>
    <g transform="translate(96 1170)">
        <g clip-path="url(#big)"><image href="images/mood-golden.jpg" width="760" height="507" preserveAspectRatio="xMidYMid slice"/></g>
    </g>
    <g transform="translate(880 1170)">
        <g clip-path="url(#sm)"><image href="images/mood-fog.jpg" width="300" height="200" preserveAspectRatio="xMidYMid slice"/></g>
        <text y="224" class="small">Nordic fog</text>
        <g transform="translate(0 250)" clip-path="url(#sm)"><image href="images/mood-neon.jpg" width="300" height="200" preserveAspectRatio="xMidYMid slice"/></g>
        <text y="474" class="small">Storm noir</text>
    </g>
    <g transform="translate(96 1720)">
        <text class="display" font-size="22" style="fill:#ffffff">Golden coast</text>
        <g class="small">
            <text y="40">Style</text><text x="140" y="40" style="fill:#ffffff">Analog film</text>
            <text y="68">Atmosphere</text><text x="140" y="68" style="fill:#ffffff">Nostalgic</text>
            <text y="96">Light</text><text x="140" y="96" style="fill:#ffffff">Golden hour</text>
            <text x="380" y="40">Color palette</text><text x="520" y="40" style="fill:#ffffff">Peach and honey</text>
            <text x="380" y="68">Camera</text><text x="520" y="68" style="fill:#ffffff">35 mm · f/2.8 · eye level</text>
            <text x="380" y="96">Locked</text><text x="520" y="96" style="fill:#ffffff">🔒 Light</text>
        </g>
    </g>
    <g transform="translate(880 1720)" class="body" font-size="16">
        <text y="0">A mood is a set of building blocks: style,</text>
        <text y="26">atmosphere, light, color palette and camera.</text>
        <text y="52">Built in or your own, each lockable, saved</text>
        <text y="78">by name. Or let MoodFrame derive one from</text>
        <text y="104">any picture.</text>
    </g>

    <!--  Frame: nested aspect ratios over one image, the closest size per model  -->
    <rect x="96" y="1920" width="1248" height="1" fill="#ffffff" fill-opacity=".12"/>
    <text x="96" y="1980" class="eyebrow" style="fill:#2fb8a6">02 · FRAME</text>
    <text x="94" y="2044" class="display" font-size="46" style="fill:#ffffff">One format. Every model.</text>
    <g transform="translate(96 2090)">
        <g clip-path="url(#frameImg)"><image href="images/mood-fog.jpg" width="640" height="427" preserveAspectRatio="xMidYMid slice" opacity=".7"/></g>
        <g fill="none" stroke-width="2">
            <rect width="640" height="427" stroke="#ffffff"/>
            <rect x="0" y="33" width="640" height="360" stroke="#2fb8a6" stroke-dasharray="8 6"/>
            <rect x="107" y="0" width="427" height="427" stroke="#f5b83d" stroke-dasharray="8 6"/>
            <rect x="200" y="0" width="240" height="427" stroke="#ff6b4a" stroke-dasharray="8 6"/>
        </g>
        <g class="small" font-weight="600">
            <text x="12" y="24" style="fill:#ffffff">3:2</text><text x="12" y="384" style="fill:#2fb8a6">16:9</text>
            <text x="117" y="414" style="fill:#f5b83d">1:1</text><text x="210" y="24" style="fill:#ff6b4a">9:16</text>
        </g>
    </g>
    <g transform="translate(800 2120)">
        <text class="body" font-size="16">A frame is a target aspect ratio and resolution.</text>
        <text y="26" class="body" font-size="16">Each model takes its closest size, and the app</text>
        <text y="52" class="body" font-size="16">shows which one before you generate.</text>
        <text y="110" class="small" style="fill:#7fb5b0">LANDSCAPE PRINT · 3:2 · 2K</text>
        <rect y="124" width="544" height="1" fill="#ffffff" fill-opacity=".15"/>
        <g class="small">
            <text y="156">FLUX.2</text><text x="544" y="156" text-anchor="end" style="fill:#ffffff">2048 × 1365</text>
            <text y="188">Nano Banana</text><text x="544" y="188" text-anchor="end" style="fill:#ffffff">3:2 · 2K</text>
            <text y="220">OpenAI-compatible</text><text x="544" y="220" text-anchor="end" style="fill:#ffffff">1536 × 1024</text>
        </g>
        <rect y="236" width="544" height="1" fill="#ffffff" fill-opacity=".15"/>
        <text y="266" class="note" style="fill:#f5b83d">Values illustrative; final page takes them from the app</text>
    </g>

    <!--  the app as a glass slab  -->
    <rect x="96" y="2600" width="1248" height="1" fill="#ffffff" fill-opacity=".12"/>
    <text x="96" y="2660" class="eyebrow" style="fill:#f5b83d">03 · THE STUDIO</text>
    <text x="94" y="2724" class="display" font-size="46" style="fill:#ffffff">Chats, brainstorm, library.</text>
    <g filter="url(#shadow)">
        <rect x="202" y="2770" width="1036" height="664" rx="14" fill="#ffffff" fill-opacity=".05" stroke="url(#glassEdge)" stroke-width="3"/>
        <image href="images/app-screenshot.png" x="220" y="2786" width="1000" height="633"/>
    </g>
    <text x="720" y="3462" class="note" text-anchor="middle" style="fill:#f5b83d">Screenshot: real app with a demo library (made-up chat names)</text>

    <!--  providers and footer  -->
    <g transform="translate(0 3560)">
        <text x="96" y="0" class="small">Works with</text>
        <text x="300" y="0" class="display" font-size="20" style="fill:#e6f0f0">[BFL logo]</text>
        <rect x="470" y="-18" width="1" height="24" fill="#ffffff" fill-opacity=".2"/>
        <text x="510" y="0" class="display" font-size="20" style="fill:#e6f0f0">[Gemini logo]</text>
        <rect x="700" y="-18" width="1" height="24" fill="#ffffff" fill-opacity=".2"/>
        <text x="740" y="0" class="display" font-size="20" style="fill:#e6f0f0">[OpenAI logo]</text>
        <text x="1344" y="0" class="small" text-anchor="end">GitHub · Changelog · MIT</text>
    </g>
</svg>

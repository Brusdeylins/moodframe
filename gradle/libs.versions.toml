# Version Catalog of MoodFrame: the one place of the versions of all dependencies and build plugins
# (build.gradle refers to them as libs.*); the links point to the documentation of the libraries

[versions]
# Core JavaFX, all modules and platforms
javafx = "23.0.2"

# HTTP Client and the Kotlin standard library it needs
okhttp = "4.12.0"
kotlin = "1.9.22"

# JSON Processing - Jackson, and org.json for the Gemini requests
jackson = "2.16.1"
json = "20240303"

# Database - SQLite with plain JDBC
sqlite = "3.44.1.0"

# Logging - Logback & SLF4J
logback = "1.4.14"
slf4j = "2.0.9"

# UI - Ikonli MaterialDesign icons, AtlantaFX theme
ikonli = "12.3.1"
atlantafx = "2.1.0"

# Testing - JUnit, Mockito, TestFX with Monocle, Hamcrest
junit = "5.10.1"
junit-platform = "1.10.1"
mockito = "5.8.0"
testfx = "4.0.18"
monocle = "21.0.2"
hamcrest = "2.2"

# Build Tools
openjfx-plugin = "0.1.0"
owasp-dependency-check = "10.0.4"
conveyor = "1.12"

[libraries]
# HTTP Client - https://square.github.io/okhttp/
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

# JSON Processing - https://github.com/FasterXML/jackson
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
json = { module = "org.json:json", version.ref = "json" }

# Database - https://github.com/xerial/sqlite-jdbc
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }

# Logging - https://logback.qos.ch/documentation.html
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# Icons - https://kordamp.org/ikonli/
ikonli-javafx = { module = "org.kordamp.ikonli:ikonli-javafx", version.ref = "ikonli" }
ikonli-materialdesign2 = { module = "org.kordamp.ikonli:ikonli-materialdesign2-pack", version.ref = "ikonli" }

# Theme - https://mkpaz.github.io/atlantafx/
atlantafx-base = { module = "io.github.mkpaz:atlantafx-base", version.ref = "atlantafx" }

# Testing - https://junit.org/junit5/docs/current/user-guide/
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
testfx-core = { module = "org.testfx:testfx-core", version.ref = "testfx" }
testfx-junit5 = { module = "org.testfx:testfx-junit5", version.ref = "testfx" }
openjfx-monocle = { module = "org.testfx:openjfx-monocle", version.ref = "monocle" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }

[bundles]
jackson = ["jackson-core", "jackson-databind", "jackson-datatype-jsr310"]
ikonli = ["ikonli-javafx", "ikonli-materialdesign2"]
testing = ["junit-jupiter", "junit-jupiter-engine", "junit-platform-launcher", "mockito-core", "testfx-core",
    "testfx-junit5", "hamcrest"]

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version.ref = "openjfx-plugin" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "owasp-dependency-check" }
conveyor = { id = "dev.hydraulic.conveyor", version.ref = "conveyor" }

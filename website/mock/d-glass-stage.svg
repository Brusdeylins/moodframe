<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="4310" viewBox="0 0 1440 4310">
    <!--  Proposal D: "Glass Stage" (A) with the mood switcher of C and the install command of the detected system; English, German via the EN/DE switch  -->
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Inter:wght@300;400;600&amp;display=swap");
        svg { fill: #c9d6d8; }
        text { font-family: Inter, -apple-system, "Helvetica Neue", sans-serif; }
        .display { font-family: "Space Grotesk", "Avenir Next", "Helvetica Neue", sans-serif; font-weight: 700; fill: #ffffff; }
        .h2 { font-family: "Space Grotesk", "Avenir Next", "Helvetica Neue", sans-serif; font-weight: 500; font-size: 44px; fill: #ffffff; }
        .eyebrow { font-size: 13px; letter-spacing: 4px; fill: #7fb5b0; }
        .body { font-size: 18px; font-weight: 300; fill: #b7c7c9; }
        .lead { font-size: 17px; font-weight: 300; fill: #b7c7c9; }
        .small { font-size: 14px; fill: #8fa3a6; }
        .chip { font-size: 13px; fill: #e6f0f0; }
        .note { font-size: 13px; fill: #f5b83d; font-style: italic; }
        .mono { font-family: "JetBrains Mono", Menlo, monospace; fill: #e6f0f0; }
    </style>
    <defs>
        <linearGradient id="mood" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ff6b4a"/><stop offset=".35" stop-color="#f5b83d"/>
            <stop offset=".7" stop-color="#2fb8a6"/><stop offset="1" stop-color="#5b6ee1"/>
        </linearGradient>
        <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0d1a1e"/><stop offset=".5" stop-color="#11252b"/><stop offset="1" stop-color="#0a1215"/>
        </linearGradient>
        <linearGradient id="heroFade" x1="0" y1="0" x2="0" y2="1">
            <stop offset=".75" stop-color="#0d1a1e" stop-opacity="0"/><stop offset="1" stop-color="#0f1f24"/>
        </linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".09"/><stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
        </linearGradient>
        <clipPath id="moodImg"><rect width="780" height="520" rx="10"/></clipPath>
        <clipPath id="frameImg"><rect width="600" height="400" rx="8"/></clipPath>
    </defs>
    <rect width="1440" height="4310" fill="url(#page)"/>

    <!--  hero: the splash scene widened, text and buttons on the calm left half above the floor  -->
    <image href="images/hero-wide.jpg" x="-200" y="0" width="1700" height="722" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1440" height="723" fill="url(#heroFade)"/>
    <image href="images/wordmark.svg" x="56" y="26" width="140" height="49"/>

    <!--  nav: the chapters in the order of the page, then language and GitHub  -->
    <g class="small" font-size="15">
        <text x="760" y="56" style="fill:#dfe9ea">Overview</text><text x="850" y="56" style="fill:#dfe9ea">Mood</text>
        <text x="918" y="56" style="fill:#dfe9ea">Frame</text><text x="992" y="56" style="fill:#dfe9ea">Models</text>
        <text x="1074" y="56" style="fill:#dfe9ea">Install</text>
        <text x="1158" y="56" style="fill:#ffffff" font-weight="600">EN</text><text x="1186" y="56" style="fill:#6f8689">DE</text>
    </g>
    <rect x="1236" y="34" width="150" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".25"/>
    <text x="1256" y="56" class="chip">GitHub</text><text x="1316" y="56" class="chip" style="fill:#2fb8a6">v2.0.0</text>

    <text x="96" y="186" class="eyebrow">DESKTOP STUDIO FOR AI IMAGES</text>
    <text x="92" y="282" class="display" font-size="96">Mood in.</text>
    <text x="92" y="378" class="display" font-size="96">Frame out.</text>
    <rect x="96" y="404" width="300" height="5" rx="2.5" fill="url(#mood)"/>
    <text x="96" y="454" class="body">The mood decides how an image feels, the frame how</text>
    <text x="96" y="480" class="body">it is rendered. One app for FLUX, Nano Banana and</text>
    <text x="96" y="506" class="body">every OpenAI-compatible image API.</text>
    <rect x="96" y="534" width="220" height="50" rx="25" fill="#ffffff"/>
    <text x="206" y="565" text-anchor="middle" font-size="16" font-weight="600" style="fill:#0d1a1e">Install for macOS ↓</text>
    <rect x="332" y="534" width="190" height="50" rx="25" fill="none" stroke="#ffffff" stroke-opacity=".4"/>
    <text x="427" y="565" text-anchor="middle" font-size="16" style="fill:#ffffff">View on GitHub</text>

    <!--  chapters: eyebrow = nav entry, headline, one lead sentence, content; same spacing everywhere  -->

    <!--  Overview: the app with its main capabilities, each marked by a dot and a line; the chapters below hold the details  -->
    <text x="96" y="700" class="eyebrow">OVERVIEW</text>
    <text x="96" y="760" class="h2">One studio, every image model</text>
    <text x="96" y="800" class="lead">Everything in one window. The chapters below go into the details.</text>
    <rect x="96" y="830" width="1248" height="600" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".14"/>
    <image href="images/app-screenshot.png" x="290" y="860" width="860" height="545"/>
    <g stroke="#ffffff" stroke-opacity=".45" stroke-width="1">
        <line x1="278" y1="982" x2="369" y2="982"/><line x1="278" y1="1061" x2="527" y2="1061"/><line x1="278" y1="1304" x2="505" y2="1304"/>
        <line x1="1050" y1="1032" x2="1162" y2="1032" stroke="#ff6b4a"/><line x1="1050" y1="1197" x2="1162" y2="1197" stroke="#2fb8a6"/>
        <line x1="1050" y1="1297" x2="1162" y2="1297" stroke="#5b6ee1"/>
    </g>
    <g stroke="#0d1a1e" stroke-width="2">
        <circle cx="369" cy="982" r="5" fill="#ffffff"/><circle cx="527" cy="1061" r="5" fill="#ffffff"/><circle cx="505" cy="1304" r="5" fill="#ffffff"/>
        <circle cx="1050" cy="1032" r="5" fill="#ff6b4a"/><circle cx="1050" cy="1197" r="5" fill="#2fb8a6"/><circle cx="1050" cy="1297" r="5" fill="#5b6ee1"/>
    </g>
    <g text-anchor="end" font-size="13">
        <text x="270" y="987" font-size="15" font-weight="600" style="fill:#ffffff">Library</text>
        <text x="270" y="1007">Chats, or all images</text><text x="270" y="1025">of a mood or frame</text>
        <text x="270" y="1066" font-size="15" font-weight="600" style="fill:#ffffff">Images</text>
        <text x="270" y="1086">each with its mood,</text><text x="270" y="1104">model and cost</text>
        <text x="270" y="1309" font-size="15" font-weight="600" style="fill:#ffffff">Prompt</text>
        <text x="270" y="1329">write what you see, or</text><text x="270" y="1347">brainstorm it with AI</text>
    </g>
    <g font-size="13">
        <text x="1170" y="1037" font-size="15" font-weight="600" style="fill:#ffffff">Mood</text>
        <text x="1170" y="1057">style, atmosphere, light,</text><text x="1170" y="1075">color and camera</text>
        <text x="1170" y="1202" font-size="15" font-weight="600" style="fill:#ffffff">Frame</text>
        <text x="1170" y="1222">aspect ratio and size</text>
        <text x="1170" y="1302" font-size="15" font-weight="600" style="fill:#ffffff">Models</text>
        <text x="1170" y="1322">FLUX, Nano Banana,</text><text x="1170" y="1340">OpenAI-compatible</text>
    </g>
    <text x="96" y="1460" class="note">Screenshot: real app (English UI) with a demo library, not this drawing; dots and lines as HTML overlay</text>

    <!--  Mood: a glass card with the switcher; the tabs swap image and recipe  -->
    <text x="96" y="1550" class="eyebrow" style="fill:#ff6b4a">MOOD</text>
    <text x="96" y="1610" class="h2">Switch the mood, keep the picture</text>
    <text x="96" y="1650" class="lead">Same prompt, three moods. A mood is made of building blocks, each one lockable.</text>
    <rect x="96" y="1680" width="1248" height="650" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".14"/>
    <g transform="translate(128 1712)">
        <rect width="420" height="40" rx="20" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".2"/>
        <rect x="4" y="4" width="136" height="32" rx="16" fill="#ff6b4a" fill-opacity=".28"/>
        <text x="72" y="25" text-anchor="middle" class="chip" style="fill:#ffffff">Golden coast</text>
        <text x="210" y="25" text-anchor="middle" class="chip" style="fill:#8fa3a6">Nordic fog</text>
        <text x="350" y="25" text-anchor="middle" class="chip" style="fill:#8fa3a6">Storm noir</text>
    </g>
    <g transform="translate(128 1780)" clip-path="url(#moodImg)"><image href="images/mood-golden.jpg" width="780" height="520" preserveAspectRatio="xMidYMid slice"/></g>
    <g transform="translate(940 1780)">
        <rect width="372" height="520" rx="12" fill="#0b1417" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".1"/>
        <rect x="24" y="26" width="5" height="24" rx="2.5" fill="#ff6b4a"/>
        <text x="40" y="46" class="display" font-size="22">Golden coast</text>
        <g class="small">
            <text x="24" y="92">Style</text><text x="24" y="116" style="fill:#e6f0f0">Analog film, Portra grain</text>
            <text x="24" y="154">Atmosphere</text><text x="24" y="178" style="fill:#e6f0f0">Nostalgic, hazy amber air</text>
            <text x="24" y="216">Light</text><text x="24" y="240" style="fill:#e6f0f0">Golden hour backlight 🔒</text>
            <text x="24" y="278">Color palette</text>
            <g transform="translate(24 290)"><rect width="40" height="20" rx="4" fill="#f4b183"/><rect x="44" width="40" height="20" rx="4" fill="#e9a35a"/><rect x="88" width="40" height="20" rx="4" fill="#7a4b33"/><rect x="132" width="40" height="20" rx="4" fill="#2d2a2a"/></g>
            <text x="24" y="346">Camera</text><text x="24" y="370" style="fill:#e6f0f0">Rangefinder · 35 mm · f/2.8 · eye level</text>
        </g>
        <rect x="24" y="398" width="324" height="1" fill="#ffffff" fill-opacity=".12"/>
        <text x="24" y="430" class="small">✦ Your own blocks and saved moods</text>
        <text x="24" y="456" class="small">✦ Mood from image: drop a picture, get its mood</text>
        <text x="24" y="482" class="small">✦ Every image remembers its mood</text>
    </g>
    <text x="96" y="2360" class="note">Interactive: the tabs swap image and recipe in place</text>

    <!--  Frame: one image with nested aspect ratios, what each model makes of it  -->
    <text x="96" y="2450" class="eyebrow" style="fill:#2fb8a6">FRAME</text>
    <text x="96" y="2510" class="h2">Say the format once</text>
    <text x="96" y="2550" class="lead">A frame is a target aspect ratio and resolution, saved by name.</text>
    <rect x="96" y="2580" width="1248" height="470" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".14"/>
    <g transform="translate(128 2614)">
        <g clip-path="url(#frameImg)"><image href="images/mood-fog.jpg" width="600" height="400" preserveAspectRatio="xMidYMid slice" opacity=".6"/></g>
        <g fill="none" stroke-width="2">
            <rect width="600" height="400" rx="8" stroke="#ffffff" stroke-opacity=".9"/>
            <rect x="0" y="31" width="600" height="338" stroke="#2fb8a6" stroke-dasharray="8 6"/>
            <rect x="100" y="0" width="400" height="400" stroke="#f5b83d" stroke-dasharray="8 6"/>
            <rect x="187" y="0" width="225" height="400" stroke="#ff6b4a" stroke-dasharray="8 6"/>
        </g>
        <g class="chip" font-weight="600">
            <text x="12" y="24">3:2</text><text x="12" y="362" style="fill:#2fb8a6">16:9</text>
            <text x="110" y="388" style="fill:#f5b83d">1:1</text><text x="197" y="24" style="fill:#ff6b4a">9:16</text>
        </g>
    </g>
    <g transform="translate(776 2646)">
        <text class="body" font-size="17">Every model takes its closest size, and the app</text>
        <text y="26" class="body" font-size="17">shows which one before you generate.</text>
        <text y="80" class="small" style="fill:#7fb5b0">LANDSCAPE PRINT · 3:2 · 2K</text>
        <rect y="94" width="520" height="1" fill="#ffffff" fill-opacity=".15"/>
        <g class="small">
            <text y="126" style="fill:#e6f0f0">FLUX.2 [pro]</text><text x="260" y="126" style="fill:#e6f0f0">2048 × 1365</text><text x="520" y="126" text-anchor="end" style="fill:#3fb950">exact</text>
            <text y="158" style="fill:#e6f0f0">Nano Banana Pro</text><text x="260" y="158" style="fill:#e6f0f0">3:2 · 2K</text><text x="520" y="158" text-anchor="end" style="fill:#3fb950">exact</text>
            <text y="190" style="fill:#e6f0f0">gpt-image</text><text x="260" y="190" style="fill:#e6f0f0">1536 × 1024</text><text x="520" y="190" text-anchor="end" style="fill:#d29922">closest</text>
        </g>
        <rect y="206" width="520" height="1" fill="#ffffff" fill-opacity=".15"/>
        <text y="242" class="small">✦ Group your library by frame</text>
        <text y="290" class="note">Values illustrative; the real page takes them from the app</text>
    </g>

    <!--  Models: the supported image APIs  -->
    <text x="96" y="3150" class="eyebrow" style="fill:#5b6ee1">MODELS</text>
    <text x="96" y="3210" class="h2">Bring your own API key</text>
    <text x="96" y="3250" class="lead">Three providers in one app. Your keys stay on your machine, encrypted.</text>
    <g>
        <rect x="96" y="3280" width="400" height="120" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".12"/>
        <rect x="520" y="3280" width="400" height="120" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".12"/>
        <rect x="944" y="3280" width="400" height="120" rx="14" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".12"/>
        <text x="296" y="3334" text-anchor="middle" class="display" font-size="24" style="fill:#e6f0f0">[BFL logo]</text>
        <text x="720" y="3334" text-anchor="middle" class="display" font-size="24" style="fill:#e6f0f0">[Gemini logo]</text>
        <text x="1144" y="3334" text-anchor="middle" class="display" font-size="24" style="fill:#e6f0f0">[OpenAI logo]</text>
        <text x="296" y="3370" text-anchor="middle" class="small">FLUX 3 · FLUX.2</text>
        <text x="720" y="3370" text-anchor="middle" class="small">Nano Banana · Omni video</text>
        <text x="1144" y="3370" text-anchor="middle" class="small">OpenAI or your own gateway</text>
    </g>

    <!--  Install: the tab of the detected system is open; the commands are those of Conveyor's download page  -->
    <text x="96" y="3500" class="eyebrow" style="fill:#f5b83d">INSTALL</text>
    <text x="96" y="3560" class="h2">Up and running in a minute</text>
    <text x="96" y="3600" class="lead">Version 2.0.0, released 12 Nov 2026. Free and open source (MIT).</text>
    <rect x="96" y="3630" width="1248" height="440" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".14"/>
    <g transform="translate(128 3660)">
        <rect width="360" height="40" rx="20" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".2"/>
        <rect x="4" y="4" width="160" height="32" rx="16" fill="#f5b83d" fill-opacity=".25"/>
        <text x="20" y="25" class="chip" style="fill:#ffffff">macOS</text>
        <text x="74" y="25" class="chip" font-size="11" style="fill:#f5b83d">Your system</text>
        <text x="216" y="25" text-anchor="middle" class="chip" style="fill:#8fa3a6">Windows</text>
        <text x="306" y="25" text-anchor="middle" class="chip" style="fill:#8fa3a6">Linux</text>
    </g>
    <rect x="128" y="3720" width="1184" height="56" rx="10" fill="#060c0e" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="150" y="3754" class="mono" font-size="16"><tspan style="fill:#6f8689">$&#160;</tspan>curl -L https://moodframe.art/download/launch.mac | bash</text>
    <rect x="1266" y="3732" width="32" height="32" rx="6" fill="#ffffff" fill-opacity=".08"/>
    <text x="1282" y="3753" text-anchor="middle" font-size="15" style="fill:#e6f0f0">⧉</text>
    <text x="128" y="3804" class="small">Paste into a terminal: the command installs and starts MoodFrame.</text>
    <text x="128" y="3828" class="small">Or download the .zip (<tspan style="fill:#e6f0f0">Apple Silicon</tspan> · <tspan style="fill:#e6f0f0">Intel</tspan>): the app is not notarized by Apple, so open it the first time with Control-click → Open.</text>
    <text x="128" y="3858" class="note">Mock only, the other two tabs:</text>
    <g transform="translate(128 3870)">
        <rect width="400" height="124" rx="10" fill="#060c0e" fill-opacity=".45" stroke="#f5b83d" stroke-opacity=".35" stroke-dasharray="4 4"/>
        <text x="20" y="30" class="small" style="fill:#e6f0f0" font-weight="600">Windows</text>
        <rect x="20" y="44" width="200" height="38" rx="19" fill="#ffffff"/>
        <text x="120" y="68" text-anchor="middle" font-size="14" font-weight="600" style="fill:#0d1a1e">Download moodframe.exe</text>
        <text x="20" y="108" class="small">Also as <tspan style="fill:#e6f0f0">.msix</tspan> · <tspan style="fill:#e6f0f0">.zip</tspan></text>
    </g>
    <g transform="translate(544 3870)">
        <rect width="768" height="124" rx="10" fill="#060c0e" fill-opacity=".45" stroke="#f5b83d" stroke-opacity=".35" stroke-dasharray="4 4"/>
        <text x="20" y="30" class="small" style="fill:#e6f0f0" font-weight="600">Linux (Debian, Ubuntu)</text>
        <text x="748" y="30" text-anchor="end" class="small">or <tspan style="fill:#e6f0f0">.tar.gz</tspan></text>
        <g class="mono" font-size="11.5">
            <text x="20" y="58"><tspan style="fill:#6f8689">$&#160;</tspan>CPU=$(dpkg --print-architecture)</text>
            <text x="20" y="80"><tspan style="fill:#6f8689">$&#160;</tspan>wget https://moodframe.art/download/debian/matthias-brusdeylins-moodframe_2.0.0_${CPU}.deb</text>
            <text x="20" y="102"><tspan style="fill:#6f8689">$&#160;</tspan>sudo apt install ./matthias-brusdeylins-moodframe_2.0.0_${CPU}.deb</text>
        </g>
    </g>
    <rect x="128" y="4016" width="1184" height="1" fill="#ffffff" fill-opacity=".12"/>
    <text x="128" y="4046" class="small">📦 Packaged with <tspan style="fill:#e6f0f0">Conveyor</tspan> by Hydraulic ↗ · MoodFrame checks for updates on every launch and updates itself</text>

    <!--  footer  -->
    <rect x="0" y="4170" width="1440" height="1" fill="#ffffff" fill-opacity=".1"/>
    <image href="images/wordmark.svg" x="96" y="4206" width="120" height="42"/>
    <text x="250" y="4234" class="small">Built with Agentic Coding using Claude Code and ASE · © Matthias Brusdeylins 2025-2026 · MIT</text>
    <text x="1344" y="4234" class="small" text-anchor="end">GitHub · Changelog · Releases</text>
</svg>

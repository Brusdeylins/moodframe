<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3320" viewBox="0 0 1440 3320">
    <!--  Proposal C "Studio Anatomy": the app is the hero, annotated; the corner cloud of the app as page background  -->
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=Inter:wght@300;400;600&amp;display=swap");
        svg { fill: #b9c3cc; }
        text { font-family: Inter, -apple-system, "Helvetica Neue", sans-serif; }
        .display { font-family: "Space Grotesk", "Avenir Next", "Helvetica Neue", sans-serif; font-weight: 700; }
        .h2 { font-family: "Space Grotesk", "Avenir Next", "Helvetica Neue", sans-serif; font-weight: 500; font-size: 40px; }
        .eyebrow { font-size: 13px; letter-spacing: 4px; }
        .body { font-size: 17px; font-weight: 300; }
        .small { font-size: 14px; }
        .note { font-size: 13px; font-style: italic; }
    </style>
    <defs>
        <linearGradient id="mood" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ff6b4a"/><stop offset=".35" stop-color="#f5b83d"/>
            <stop offset=".7" stop-color="#2fb8a6"/><stop offset="1" stop-color="#5b6ee1"/>
        </linearGradient>
        <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
            <stop offset=".2" stop-color="#0d1117" stop-opacity="0"/><stop offset=".7" stop-color="#0d1117"/>
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".6"/></filter>
        <clipPath id="hero"><rect width="840" height="560" rx="10"/></clipPath>
        <clipPath id="crop"><rect width="420" height="280" rx="8"/></clipPath>
    </defs>
    <rect width="1440" height="3320" fill="#0d1117"/>
    <image href="images/corner-cloud.png" x="-60" y="-40" width="1300" height="970"/>
    <rect width="1440" height="1100" fill="url(#fade)"/>

    <!--  nav  -->
    <image href="images/wordmark.svg" x="56" y="26" width="140" height="49"/>
    <g class="small" style="fill:#e6edf3">
        <text x="880" y="56">Mood</text><text x="948" y="56">Frame</text><text x="1024" y="56">Models</text><text x="1106" y="56">Download</text>
    </g>
    <rect x="1220" y="34" width="166" height="34" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="1238" y="56" class="small" style="fill:#e6edf3">★ GitHub</text>
    <rect x="1316" y="40" width="58" height="22" rx="11" fill="#2fb8a6" fill-opacity=".2"/>
    <text x="1345" y="56" class="small" text-anchor="middle" style="fill:#2fb8a6">2.0.0</text>

    <!--  hero: centered claim, then the annotated app  -->
    <text x="720" y="190" class="display" font-size="68" text-anchor="middle" style="fill:#ffffff">One studio. Every image model.</text>
    <text x="720" y="240" class="body" text-anchor="middle" font-size="19">Pick a mood, pick a frame, write what you see. MoodFrame builds the prompt for FLUX, Nano Banana</text>
    <text x="720" y="268" class="body" text-anchor="middle" font-size="19">or any OpenAI-compatible API, and keeps every image with the mood it was made in.</text>
    <rect x="540" y="300" width="200" height="50" rx="8" fill="url(#mood)"/>
    <text x="640" y="331" text-anchor="middle" font-size="16" font-weight="600" style="fill:#0d1117">Download 2.0.0</text>
    <rect x="752" y="300" width="148" height="50" rx="8" fill="#21262d" stroke="#30363d"/>
    <text x="826" y="331" text-anchor="middle" font-size="16" style="fill:#e6edf3">View source</text>
    <text x="720" y="380" class="small" text-anchor="middle">macOS · Windows · Linux · free, MIT</text>

    <g filter="url(#shadow)"><image href="images/app-screenshot.png" x="170" y="420" width="1100" height="697"/></g>
    <g font-size="14" font-weight="600">
        <line x1="120" y1="560" x2="200" y2="560" stroke="#e6edf3" stroke-opacity=".5"/>
        <circle cx="110" cy="560" r="14" fill="#ffffff"/><text x="110" y="565" text-anchor="middle" style="fill:#0d1117">1</text>
        <line x1="1350" y1="560" x2="1230" y2="560" stroke="#e6edf3" stroke-opacity=".5"/>
        <circle cx="1360" cy="560" r="14" fill="#bf8aff"/><text x="1360" y="565" text-anchor="middle" style="fill:#0d1117">2</text>
        <line x1="1350" y1="840" x2="1230" y2="840" stroke="#e6edf3" stroke-opacity=".5"/>
        <circle cx="1360" cy="840" r="14" fill="#2fb8a6"/><text x="1360" y="845" text-anchor="middle" style="fill:#0d1117">3</text>
        <line x1="120" y1="1040" x2="390" y2="1040" stroke="#e6edf3" stroke-opacity=".5"/>
        <circle cx="110" cy="1040" r="14" fill="#f5b83d"/><text x="110" y="1045" text-anchor="middle" style="fill:#0d1117">4</text>
    </g>
    <g transform="translate(170 1170)" class="small">
        <text style="fill:#ffffff" font-weight="600">1  Library</text><text y="22">Chats, or all images of a mood or frame</text>
        <text x="290" style="fill:#ffffff" font-weight="600">2  Mood</text><text x="290" y="22">Style, atmosphere, light, color, camera</text>
        <text x="580" style="fill:#ffffff" font-weight="600">3  Frame</text><text x="580" y="22">Aspect ratio and resolution, per model</text>
        <text x="870" style="fill:#ffffff" font-weight="600">4  Brainstorm</text><text x="870" y="22">From a rough idea to the final prompt</text>
    </g>
    <text x="720" y="1240" class="note" text-anchor="middle" style="fill:#f5b83d">Screenshot: real app with a demo library (made-up chat names), annotations as HTML overlays</text>

    <!--  mood switcher: tabs change the image and the recipe  -->
    <text x="96" y="1360" class="eyebrow" style="fill:#bf8aff">MOOD</text>
    <text x="94" y="1414" class="h2" style="fill:#ffffff">Switch the mood, keep the picture</text>
    <g transform="translate(96 1450)">
        <rect width="380" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
        <rect x="4" y="4" width="124" height="32" rx="16" fill="#bf8aff" fill-opacity=".25"/>
        <text x="66" y="25" text-anchor="middle" class="small" style="fill:#ffffff">Golden coast</text>
        <text x="190" y="25" text-anchor="middle" class="small">Nordic fog</text>
        <text x="314" y="25" text-anchor="middle" class="small">Storm noir</text>
    </g>
    <g transform="translate(96 1510)" clip-path="url(#hero)"><image href="images/mood-golden.jpg" width="840" height="560" preserveAspectRatio="xMidYMid slice"/></g>
    <g transform="translate(976 1510)">
        <rect width="368" height="560" rx="10" fill="#161b22" fill-opacity=".8" stroke="#30363d"/>
        <text x="24" y="44" class="display" font-size="22" style="fill:#ffffff">Golden coast</text>
        <g class="small">
            <text x="24" y="90">Style</text><text x="24" y="114" style="fill:#e6edf3">Analog film, Portra grain</text>
            <text x="24" y="154">Atmosphere</text><text x="24" y="178" style="fill:#e6edf3">Nostalgic, hazy amber air</text>
            <text x="24" y="218">Light</text><text x="24" y="242" style="fill:#e6edf3">Golden hour backlight 🔒</text>
            <text x="24" y="282">Color palette</text>
            <g transform="translate(24 294)"><rect width="40" height="20" rx="4" fill="#f4b183"/><rect x="44" width="40" height="20" rx="4" fill="#e9a35a"/><rect x="88" width="40" height="20" rx="4" fill="#7a4b33"/><rect x="132" width="40" height="20" rx="4" fill="#2d2a2a"/></g>
            <text x="24" y="352">Camera</text><text x="24" y="376" style="fill:#e6edf3">Rangefinder · 35 mm · f/2.8 · eye level</text>
        </g>
        <rect x="24" y="410" width="320" height="1" fill="#30363d"/>
        <text x="24" y="444" class="small">Own blocks, locks, saved moods.</text>
        <text x="24" y="468" class="small">Mood from image: drop a picture,</text>
        <text x="24" y="492" class="small">get its mood.</text>
    </g>

    <!--  frame: chips with what each model makes of it  -->
    <text x="96" y="2180" class="eyebrow" style="fill:#2fb8a6">FRAME</text>
    <text x="94" y="2234" class="h2" style="fill:#ffffff">Say the format once</text>
    <g transform="translate(96 2270)" class="small">
        <rect width="64" height="36" rx="6" fill="#161b22" stroke="#30363d"/><text x="32" y="23" text-anchor="middle">1:1</text>
        <rect x="74" width="64" height="36" rx="6" fill="#2fb8a6" fill-opacity=".2" stroke="#2fb8a6"/><text x="106" y="23" text-anchor="middle" style="fill:#ffffff">3:2</text>
        <rect x="148" width="64" height="36" rx="6" fill="#161b22" stroke="#30363d"/><text x="180" y="23" text-anchor="middle">16:9</text>
        <rect x="222" width="64" height="36" rx="6" fill="#161b22" stroke="#30363d"/><text x="254" y="23" text-anchor="middle">9:16</text>
        <rect x="296" width="64" height="36" rx="6" fill="#161b22" stroke="#30363d"/><text x="328" y="23" text-anchor="middle">21:9</text>
        <rect x="390" width="54" height="36" rx="6" fill="#161b22" stroke="#30363d"/><text x="417" y="23" text-anchor="middle">1K</text>
        <rect x="454" width="54" height="36" rx="6" fill="#2fb8a6" fill-opacity=".2" stroke="#2fb8a6"/><text x="481" y="23" text-anchor="middle" style="fill:#ffffff">2K</text>
        <rect x="518" width="54" height="36" rx="6" fill="#161b22" stroke="#30363d"/><text x="545" y="23" text-anchor="middle">4K</text>
    </g>
    <g transform="translate(96 2330)">
        <g clip-path="url(#crop)"><image href="images/mood-neon.jpg" width="420" height="280" preserveAspectRatio="xMidYMid slice"/></g>
        <rect width="420" height="280" rx="8" fill="none" stroke="#2fb8a6" stroke-width="2"/>
    </g>
    <g transform="translate(560 2350)" class="small">
        <text style="fill:#8b949e">MODEL</text><text x="300" style="fill:#8b949e">GETS</text>
        <rect y="14" width="680" height="1" fill="#30363d"/>
        <text y="48" style="fill:#e6edf3">FLUX.2 [pro]</text><text x="300" y="48" style="fill:#e6edf3">2048 × 1365</text><text x="680" y="48" text-anchor="end" style="fill:#3fb950">exact</text>
        <text y="84" style="fill:#e6edf3">FLUX 3</text><text x="300" y="84" style="fill:#e6edf3">2048 × 1365</text><text x="680" y="84" text-anchor="end" style="fill:#3fb950">exact</text>
        <text y="120" style="fill:#e6edf3">Nano Banana Pro</text><text x="300" y="120" style="fill:#e6edf3">3:2 · 2K</text><text x="680" y="120" text-anchor="end" style="fill:#3fb950">exact</text>
        <text y="156" style="fill:#e6edf3">gpt-image</text><text x="300" y="156" style="fill:#e6edf3">1536 × 1024</text><text x="680" y="156" text-anchor="end" style="fill:#d29922">closest</text>
        <rect y="174" width="680" height="1" fill="#30363d"/>
        <text y="210" class="note" style="fill:#f5b83d">Values illustrative; final page takes them from the app's model table</text>
    </g>

    <!--  providers  -->
    <text x="720" y="2760" class="eyebrow" text-anchor="middle" style="fill:#8b949e">YOUR KEYS, YOUR PROVIDERS</text>
    <g>
        <rect x="216" y="2790" width="320" height="140" rx="12" fill="#161b22" stroke="#30363d"/>
        <rect x="560" y="2790" width="320" height="140" rx="12" fill="#161b22" stroke="#30363d"/>
        <rect x="904" y="2790" width="320" height="140" rx="12" fill="#161b22" stroke="#30363d"/>
        <text x="376" y="2850" text-anchor="middle" class="display" font-size="24" style="fill:#e6edf3">[BFL logo]</text>
        <text x="720" y="2850" text-anchor="middle" class="display" font-size="24" style="fill:#e6edf3">[Gemini logo]</text>
        <text x="1064" y="2850" text-anchor="middle" class="display" font-size="24" style="fill:#e6edf3">[OpenAI logo]</text>
        <text x="376" y="2890" text-anchor="middle" class="small">FLUX 3 · FLUX.2</text>
        <text x="720" y="2890" text-anchor="middle" class="small">Nano Banana · Omni video · Brainstorm</text>
        <text x="1064" y="2890" text-anchor="middle" class="small">OpenAI or your own gateway</text>
    </g>

    <!--  download band with the GitHub release  -->
    <rect x="96" y="3000" width="1248" height="200" rx="14" fill="#161b22" stroke="#30363d"/>
    <rect x="96" y="3000" width="1248" height="4" fill="url(#mood)"/>
    <text x="136" y="3064" class="display" font-size="30" style="fill:#ffffff">MoodFrame 2.0.0</text>
    <text x="136" y="3096" class="small">Latest release on GitHub · 12 Nov 2026 · <tspan style="fill:#2fb8a6">What's new ↗</tspan></text>
    <text x="136" y="3160" class="small">Built with Agentic Coding using Claude Code and ASE · © Matthias Brusdeylins 2025-2026 · MIT</text>
    <g class="small">
        <rect x="860" y="3040" width="140" height="64" rx="10" fill="#ffffff"/><text x="930" y="3068" text-anchor="middle" font-weight="600" style="fill:#0d1117">macOS</text><text x="930" y="3088" text-anchor="middle" font-size="11" style="fill:#57606a">Apple Silicon · Intel</text>
        <rect x="1012" y="3040" width="140" height="64" rx="10" fill="#21262d" stroke="#30363d"/><text x="1082" y="3068" text-anchor="middle" style="fill:#e6edf3">Windows</text><text x="1082" y="3088" text-anchor="middle" font-size="11">exe · msix</text>
        <rect x="1164" y="3040" width="140" height="64" rx="10" fill="#21262d" stroke="#30363d"/><text x="1234" y="3068" text-anchor="middle" style="fill:#e6edf3">Linux</text><text x="1234" y="3088" text-anchor="middle" font-size="11">deb · tar.gz</text>
    </g>
    <text x="720" y="3270" class="note" text-anchor="middle" style="fill:#f5b83d">Version and date fetched from api.github.com/repos/Brusdeylins/moodframe/releases/latest</text>
</svg>
